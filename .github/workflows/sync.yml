name: Spotify sync

# Spotify's recently-played endpoint only keeps the last 50 plays, so this
# polls every 30 minutes. Vercel Hobby crons can only run once a day, which
# is why this lives in GitHub Actions. GitHub pauses scheduled workflows
# after 60 days without repository activity; re-enable it in the Actions tab.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull recently played into the app
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          # Until both secrets are set, skip quietly instead of failing every 30 min.
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "CRON_SECRET or APP_URL not set; skipping."
            exit 0
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "$body"
          if [ "$code" -ge 400 ]; then
            echo "::error::Sync failed with HTTP $code"
            exit 1
          fi
