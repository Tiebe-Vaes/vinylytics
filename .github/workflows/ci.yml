name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Route types (PageProps, LayoutProps) live in git-ignored .next/types.
      - run: npm run typecheck
      - run: npx eslint src
      - run: npx vitest run
      # No DATABASE_URL: the build must work before anyone has a database.
      - run: npx next build
